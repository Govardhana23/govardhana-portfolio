<!DOCTYPE html>
<html lang="en" class="dark scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Govardhana Guhanesh K — Software Engineer & AI/ML Enthusiast</title>
    <meta name="description" content="Portfolio of Govardhana Guhanesh K — Artificial Intelligence & Data Science undergraduate, software engineer, and AI/ML builder from Chennai, India." />
    
    <!-- Open Graph / Meta -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Govardhana Guhanesh K — Engineering Intelligent Experiences" />
    <meta property="og:description" content="Building intelligent systems, scalable software, and technology that solves real-world problems. Flagship: SpecMatch AI." />
    <meta name="theme-color" content="#08090D" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>" />

    <!-- Google Fonts: Space Grotesk, Inter, JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Tailwind CSS Script with Custom Theme Extension -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              brand: {
                bg: '#08090D',
                surface: '#10121A',
                elevated: '#171A26',
                border: '#23273A',
                borderLight: '#32374E',
                text: '#F5F7FF',
                textMuted: '#9298A8',
                blue: '#4D8DFF',
                violet: '#916BFF',
                cyan: '#00F2FE',
                emerald: '#10B981',
                amber: '#F59E0B'
              }
            },
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              heading: ['Space Grotesk', 'Inter', 'sans-serif'],
              mono: ['JetBrains Mono', 'monospace'],
            },
            animation: {
              'pulse-subtle': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'spin-slow': 'spin 20s linear infinite',
              'float': 'float 6s ease-in-out infinite',
              'shimmer': 'shimmer 2.5s infinite',
            },
            keyframes: {
              float: {
                '0%, 100%': { transform: 'translateY(0px)' },
                '50%': { transform: 'translateY(-12px)' },
              },
              shimmer: {
                '100%': { transform: 'translateX(100%)' }
              }
            }
          }
        }
      }
    </script>
    <style>
      :root {
        --bg-main: #08090D;
        --bg-surface: #10121A;
        --text-main: #F5F7FF;
        --text-sub: #9298A8;
        --border-subtle: #23273A;
      }
      .light {
        --bg-main: #F8FAFC;
        --bg-surface: #FFFFFF;
        --text-main: #0F172A;
        --text-sub: #64748B;
        --border-subtle: #E2E8F0;
      }
      body {
        font-family: 'Inter', sans-serif;
        background-color: var(--bg-main);
        color: var(--text-main);
        overflow-x: hidden;
        transition: background-color 0.3s ease, color 0.3s ease;
      }
      /* Custom glowing accents */
      .glow-blue {
        box-shadow: 0 0 35px -5px rgba(77, 141, 255, 0.25);
      }
      .glow-violet {
        box-shadow: 0 0 35px -5px rgba(145, 107, 255, 0.25);
      }
      .gradient-border {
        position: relative;
        background: linear-gradient(135deg, rgba(77,141,255,0.2) 0%, rgba(145,107,255,0.05) 50%, rgba(255,255,255,0.05) 100%);
        padding: 1px;
      }
      /* Custom scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #08090D;
      }
      ::-webkit-scrollbar-thumb {
        background: #23273A;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #4D8DFF;
      }
      .text-gradient {
        background: linear-gradient(135deg, #F5F7FF 0%, #B4C6FF 50%, #916BFF 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .text-gradient-blue {
        background: linear-gradient(135deg, #4D8DFF 0%, #916BFF 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .grid-pattern {
        background-size: 40px 40px;
        background-image: 
          linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      }
      .light .grid-pattern {
        background-image: 
          linear-gradient(to right, rgba(0, 0, 0, 0.04) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(0, 0, 0, 0.04) 1px, transparent 1px);
      }
    </style>
  </head>
  <body class="selection:bg-brand-blue selection:text-white antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
